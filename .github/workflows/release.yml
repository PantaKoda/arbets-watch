name: Release

# Publishing a release is a maintainer action: push a tag "vX.Y.Z" on main matching <Version> in
# Directory.Build.props, with a "## [X.Y.Z]" section in CHANGELOG.md. These releases are the update channel for
# every installed copy, so the job that runs restore, build and tests never holds a write token: "build" has
# read-only contents and doesn't persist credentials; "release" only downloads the finished files and publishes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check the tag matches the version and is on main
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (dotnet msbuild src/ArbetsWatch.Desktop/ArbetsWatch.Desktop.csproj -getProperty:Version).Trim()
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match Version $version in Directory.Build.props." }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG is not on main." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md (outside the working tree)
        shell: pwsh
        run: pwsh scripts/release-notes.ps1 -Version ${{ steps.version.outputs.version }} -OutFile "$env:RUNNER_TEMP/release-notes.md"

      - name: Build, test and package (fails on a dirty tree)
        shell: pwsh
        run: |
          pwsh scripts/publish-windows.ps1
          Copy-Item "$env:RUNNER_TEMP/release-notes.md" artifacts/release/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: artifacts/release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" \
            "release/ArbetsWatch-$VERSION-win-x64.zip" \
            "release/ArbetsWatch-$VERSION-win-x64.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "ArbetsWatch $VERSION" --notes-file release/release-notes.md --verify-tag
